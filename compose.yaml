services:
  agent:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:?Set MCP_ACCESS_TOKEN using host environment or a secret manager}
      NARU_KEY: ${NARU_KEY:-}
      MCP_ALLOWED_HOSTS: ${PUBLIC_HOST:?Set an approved public domain},${PUBLIC_HOST}:443,localhost:*,127.0.0.1:*
    expose:
      - "8000"
    volumes:
      - ./data:/app/data:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set an approved public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
